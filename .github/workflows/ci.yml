name: Analyse, tests et APK

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Version alignée sur le projet (Gradle 8.12 / AGP 8.7.3 / Dart >= 3.8)
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      # Seules les ERREURS bloquent : les avertissements et remarques hérités (64 au départ de l'étape 0)
      # sont listés dans le journal, sans faire échouer la construction.
      - name: Analyse
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Tous les fichiers de test/ (un fichier par thème).
      - name: Tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: prestige-pharmacien-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
