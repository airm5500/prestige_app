name: Analyse, tests et APK

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Version alignée sur le projet (Gradle 8.12 / AGP 8.7.3 / Dart >= 3.8)
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      # Les ERREURS bloquent. Les avertissements et remarques hérités sont listés sans bloquer, mais leur
      # nombre ne doit pas augmenter : plafond 57 (relevé le 13/10/2026) — le baisser quand on en corrige.
      - name: Analyse
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings | tee analyse.txt
          n=$(grep -cE '^ *(info|warning|error) •' analyse.txt || true)
          echo "Remarques de l'analyse : $n (plafond 57)"
          test "$n" -le 57

      # TOUT test/ (voir test/README.md) : non-régression, unitaires, intégration et bout en bout contre le faux
      # serveur Prestige local (127.0.0.1), ergonomie (5 tailles d'écran × 2 échelles de texte) et cohérence du
      # thème. Aucun émulateur ni vrai serveur nécessaire.
      - name: Tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: prestige-pharmacien-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
