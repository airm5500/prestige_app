name: Analyse, tests et APK

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Version alignée sur le projet (Gradle 8.12 / AGP 8.7.3 / Dart >= 3.8)
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      # Les ERREURS bloquent. Les avertissements et remarques hérités sont listés sans bloquer, mais leur
      # nombre ne doit pas augmenter : plafond 44 (relevé le 15/10/2026, 3.10.0 ; 57 auparavant) — le baisser quand
      # on en corrige.
      - name: Analyse
        id: analyse
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings | tee analyse.txt
          n=$(grep -cE '^ *(info|warning|error) •' analyse.txt || true)
          echo "Remarques de l'analyse : $n (plafond 44)"
          test "$n" -le 44

      # Socle de tests (voir test/README.md), par catégorie pour des journaux lisibles. Aucun émulateur ni vrai
      # serveur : l'application entière tourne dans `flutter test`, contre le faux serveur Prestige.
      # Garde-fou : tout fichier *_test.dart de test/ doit appartenir à une catégorie lancée ci-dessous.
      - name: Contrôle des catégories de tests
        id: categories
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          hors=$(find test -name '*_test.dart' | grep -vE '^test/[^/]+_test\.dart$|^test/(unitaires|non_regression|integration|e2e|ergonomie|performance|reseau)/' || true)
          if [ -n "$hors" ]; then echo "::error title=Tests hors catégorie::$hors"; exit 1; fi
          mkdir -p build/rapport_tests

      # Toutes les catégories sont jouées même si l'une échoue (rapport complet) ; le job échoue alors, et l'APK
      # n'est pas construit. Chaque catégorie écrit aussi ses résultats (JSON) pour le rapport.
      - name: Tests unitaires et non-régression
        if: ${{ !cancelled() && steps.categories.outcome == 'success' }}
        shell: bash
        run: flutter test --file-reporter json:build/rapport_tests/1-unitaires.json $(find test -maxdepth 1 -name '*_test.dart' | sort) test/unitaires test/non_regression

      - name: Tests d'intégration (services contre le faux serveur HTTP local)
        if: ${{ !cancelled() && steps.categories.outcome == 'success' }}
        run: flutter test --file-reporter json:build/rapport_tests/2-integration.json test/integration

      - name: Tests de bout en bout (application entière, deux interfaces, pannes)
        if: ${{ !cancelled() && steps.categories.outcome == 'success' }}
        run: flutter test --file-reporter json:build/rapport_tests/3-e2e.json test/e2e

      - name: Tests d'ergonomie et de cohérence d'affichage (5 tailles × 2 échelles de texte)
        if: ${{ !cancelled() && steps.categories.outcome == 'success' }}
        run: flutter test --file-reporter json:build/rapport_tests/4-ergonomie.json test/ergonomie

      # Un fichier à la fois (-j 1) : les temps mesurés ne sont pas faussés par les autres tests.
      - name: Tests de performance (temps, images, nombre de requêtes, PDF — seuils)
        if: ${{ !cancelled() && steps.categories.outcome == 'success' }}
        run: flutter test -j 1 --file-reporter json:build/rapport_tests/5-performance.json test/performance

      - name: Tests réseau (serveur lent, réponses tronquées, coupures, local/distant, HTTPS)
        if: ${{ !cancelled() && steps.categories.outcome == 'success' }}
        run: flutter test --file-reporter json:build/rapport_tests/6-reseau.json test/reseau

      # Rapport de tests de livraison : résumé par catégorie + mesures de performance et de requêtes, dans le
      # résumé du job et en artefact « rapport-tests » (à côté de l'APK).
      - name: Rapport de tests de livraison
        if: ${{ !cancelled() && steps.categories.outcome == 'success' }}
        shell: bash
        run: dart run tool/rapport_tests.dart build/rapport_tests >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.categories.outcome == 'success' }}
        with:
          name: rapport-tests
          path: |
            build/rapport_tests/rapport.md
            build/rapport_tests/resume.json
            build/rapport_tests/*.json
          retention-days: 30

      # APK construit seulement si l'analyse et TOUTES les catégories de tests ont réussi (étapes sans condition :
      # sautées dès qu'une étape précédente a échoué).
      - name: Build APK
        run: flutter build apk --release

      # 3.13.1 : l'APK (terminaux Sunmi, PC du pharmacien) garde l'API cible de Flutter (35) ; seul le build Google Play
      # passe à 36 (play.yml).
      - name: API cible de l'APK (35, pas 36)
        shell: bash
        run: |
          manifeste=$(find build/app/intermediates -path '*merged_manifest*' -path '*elease*' -name AndroidManifest.xml | head -1)
          cible=$(grep -o 'android:targetSdkVersion="[0-9]*"' "$manifeste" | head -1)
          echo "APK : $cible ($manifeste)"
          if [ "$cible" != 'android:targetSdkVersion="35"' ]; then echo "::error title=API cible de l'APK::$cible (attendu : 35)"; exit 1; fi
          echo "::notice title=API cible de l'APK::$cible"

      # 3.13.1 : le build Google Play (targetSdk / compileSdk 36) est construit ici aussi, SANS clé (signé debug, jamais
      # publié) : une incompatibilité d'Android 16 (greffon, Gradle) se voit à chaque envoi de code, même sans secrets.
      - name: Contrôle du build Google Play (App Bundle targetSdk 36, sans clé)
        shell: bash
        run: |
          flutter build appbundle --release --android-project-arg=pharmacienTargetSdk=36
          manifeste=$(find build/app/intermediates -path '*merged_manifest*' -path '*elease*' -name AndroidManifest.xml | head -1)
          grep -q 'android:targetSdkVersion="36"' "$manifeste" || { echo "::error title=Build Google Play::targetSdk 36 non appliqué"; exit 1; }
          [ -s build/app/outputs/bundle/release/app-release.aab ] || { echo "::error title=Build Google Play::App Bundle absent"; exit 1; }
          echo "::notice title=Build Google Play::App Bundle targetSdk 36 construit (signé debug, contrôle seulement)"

      - uses: actions/upload-artifact@v4
        with:
          name: prestige-pharmacien-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  # 3.12.0 — iPhone et iPad : construction iOS SANS signature (vérifie que le projet iOS compile : Podfile, plugins,
  # Info.plist, icônes) et tests des capacités iOS. Indépendant du job Android ci-dessus (aucun impact sur lui).
  # L'envoi signé vers TestFlight est dans testflight.yml (lancé à la main, seulement si les secrets existent).
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Apple exige le SDK iOS 26 (Xcode 26 ou plus) pour tout envoi à App Store Connect / TestFlight.
      - name: Xcode 26 ou plus récent
        run: |
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9][0-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "Xcode présents :"; ls -d /Applications/Xcode*.app
            echo "::error title=Xcode::aucun Xcode 26 (ou plus) stable sur cette machine : Apple refuse les envois faits avec un SDK plus ancien."
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Tests des capacités iOS
        run: flutter test test/unitaires/ios_test.dart

      - name: Build iOS (sans signature)
        run: flutter build ios --release --no-codesign

      - name: Contrôle du paquet (identifiant, version, nom affiché)
        shell: bash
        run: |
          plist=build/ios/iphoneos/Runner.app/Info.plist
          lire() { /usr/libexec/PlistBuddy -c "Print :$1" "$plist"; }
          attendu=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '[:space:]')
          version="$(lire CFBundleShortVersionString)+$(lire CFBundleVersion)"
          bundle=$(sed -n 's/^PRESTIGE_BUNDLE_ID *= *//p' ios/Flutter/Prestige.xcconfig)
          echo "pubspec.yaml : $attendu · application : $version · $(lire CFBundleIdentifier) · « $(lire CFBundleDisplayName) » · iOS min : $(lire MinimumOSVersion)"
          [ "$version" = "$attendu" ] || { echo "::error title=Version iOS::$version ≠ pubspec.yaml $attendu"; exit 1; }
          [ "$(lire CFBundleIdentifier)" = "$bundle" ] || { echo "::error title=Bundle ID::≠ ios/Flutter/Prestige.xcconfig ($bundle)"; exit 1; }
          [ "$(lire NSAppTransportSecurity:NSAllowsLocalNetworking)" = "true" ] || { echo "::error title=ATS::NSAllowsLocalNetworking absent"; exit 1; }
          if lire NSAppTransportSecurity:NSAllowsArbitraryLoads > /dev/null 2>&1; then echo "::error title=ATS::NSAllowsArbitraryLoads ne doit pas être présent"; exit 1; fi
          lire NSLocalNetworkUsageDescription > /dev/null || { echo "::error title=Info.plist::NSLocalNetworkUsageDescription absent"; exit 1; }
          # 3.12.1 : iOS 15 au minimum (avertissement ITMS-90068 d'Apple sur iOS 13).
          [ "$(lire MinimumOSVersion)" = "15.0" ] || { echo "::error title=iOS minimal::$(lire MinimumOSVersion) ≠ 15.0"; exit 1; }
          echo "::notice title=Application iOS::$version · $(lire CFBundleIdentifier) · iOS $(lire MinimumOSVersion) minimum"
