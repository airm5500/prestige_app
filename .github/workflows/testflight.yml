# Envoi de Prestige Pharmacien vers TestFlight (iPhone et iPad) — 3.12.0. Mode d'emploi : docs/ios/README.md.
#
# Lancement : étiquette « ios-v<version>-<build> » (ex. ios-v3.12.0-48), modification de ios/DEMANDE_TESTFLIGHT
# sur claude/presences (contenu = version de pubspec.yaml), ou GitHub › Actions › « TestFlight (iOS) »
# › Run workflow (ce bouton n'existe que pour la branche par défaut).
# Rien ne se passe tant que les QUATRE secrets ne sont pas déposés par le pharmacien (Settings › Secrets and
# variables › Actions) : APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY
# (contenu du fichier .p8) et APPLE_TEAM_ID. Variables facultatives du dépôt : IOS_BUNDLE_ID (sinon la valeur de
# ios/Flutter/Prestige.xcconfig), TESTFLIGHT_GROUP (groupe de testeurs, envois par étiquette).
#
# Signature : automatique, gérée par Apple (xcodebuild -allowProvisioningUpdates avec la clé API : aucun certificat
# ni profil à déposer). Envoi : asc (App Store Connect CLI, open source, licence MIT,
# https://github.com/rorkai/App-Store-Connect-CLI), version ÉPINGLÉE et empreinte SHA-256 vérifiée.
# Secrets : jamais écrits dans le dépôt ni affichés ; la clé .p8 est écrite dans le dossier temporaire du runner
# (droits 600) puis supprimée, même en cas d'échec.
name: TestFlight (iOS)

on:
  # Étiquette (tag) « ios-v<version>-<build> » poussée sur n'importe quelle branche (ex. ios-v3.12.0-48 sur
  # claude/presences) : envoi de cette version, sans passer par la branche par défaut. Le tag doit correspondre à
  # pubspec.yaml.
  push:
    tags:
      - 'ios-v*'
    # Demande d'envoi par fichier (même effet qu'une étiquette) : modifier ios/DEMANDE_TESTFLIGHT sur
    # claude/presences avec la version de pubspec.yaml (ex. 3.12.0+48). Les filtres de chemins ne s'appliquent
    # pas aux étiquettes.
    branches:
      - 'claude/presences'
    paths:
      - 'ios/DEMANDE_TESTFLIGHT'
  workflow_dispatch:
    inputs:
      numero_build:
        description: "Numéro de build (vide : <N de pubspec>.<numéro du run>, toujours unique)."
        required: false
        default: ''
      groupe:
        description: "Groupe de testeurs TestFlight (vide : variable TESTFLIGHT_GROUP, sinon aucun)."
        required: false
        default: ''
      quoi_tester:
        description: "Notes « Quoi tester » (vide : texte par défaut)."
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  ASC_VERSION: '5.14.3'
  ASC_SHA256_MACOS_ARM64: '8445a2110c4472e926bac69cf90ebcec91a28e4eb142b6d2c81fc4addb16aaae'

jobs:
  # Les secrets ne peuvent pas être lus dans un « if » de job : ce petit job dit seulement s'ils existent tous.
  verifier:
    runs-on: ubuntu-latest
    outputs:
      pret: ${{ steps.secrets.outputs.pret }}
    steps:
      - uses: actions/checkout@v4

      # Étiquette : « ios-v » + version de pubspec.yaml avec « - » à la place du « + » (3.12.0+48 → ios-v3.12.0-48).
      - name: Étiquette conforme à pubspec.yaml
        if: github.ref_type == 'tag'
        env:
          ETIQUETTE: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '[:space:]')
          attendu="ios-v${version/+/-}"
          if [ "$ETIQUETTE" != "$attendu" ]; then
            echo "::error title=Étiquette::$ETIQUETTE ne correspond pas à pubspec.yaml ($version) : attendu $attendu"
            exit 1
          fi
          echo "::notice title=Étiquette::$ETIQUETTE = pubspec.yaml $version"

      # Demande par fichier : la 1re ligne de ios/DEMANDE_TESTFLIGHT doit être exactement la version de pubspec.yaml
      # (les lignes suivantes gardent l'historique des demandes ; en ajouter une relance l'envoi).
      - name: Demande conforme à pubspec.yaml
        if: github.ref_type == 'branch' && github.event_name == 'push'
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '[:space:]')
          demande=$(head -n 1 ios/DEMANDE_TESTFLIGHT | tr -d '[:space:]')
          if [ "$demande" != "$version" ]; then
            echo "::error title=Demande TestFlight::ios/DEMANDE_TESTFLIGHT ($demande) ne correspond pas à pubspec.yaml ($version)"
            exit 1
          fi
          echo "::notice title=Demande TestFlight::$demande = pubspec.yaml $version"

      - id: secrets
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$PRIVATE_KEY" ] && [ -n "$TEAM_ID" ]; then
            echo "pret=true" >> "$GITHUB_OUTPUT"
          else
            echo "pret=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=TestFlight::Secrets App Store Connect absents : rien n'est envoyé (docs/ios/README.md)."
          fi

  testflight:
    needs: verifier
    if: needs.verifier.outputs.pret == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Valeurs brutes des secrets ; ASC_KEY_ID, ASC_ISSUER_ID et APPLE_TEAM_ID (nettoyées) sont posées par l'étape
      # « Forme des secrets » pour les étapes suivantes.
      SECRET_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      SECRET_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      SECRET_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_BYPASS_KEYCHAIN: '1'
      ASC_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Identifiant de l'application (variable IOS_BUNDLE_ID, sinon Prestige.xcconfig)
        env:
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
        run: |
          if [ -n "$IOS_BUNDLE_ID" ]; then
            printf 'PRESTIGE_BUNDLE_ID = %s\n' "$IOS_BUNDLE_ID" > ios/Flutter/Prestige.xcconfig
          fi
          bundle=$(sed -n 's/^PRESTIGE_BUNDLE_ID *= *//p' ios/Flutter/Prestige.xcconfig)
          echo "Identifiant : $bundle"
          echo "BUNDLE_ID=$bundle" >> "$GITHUB_ENV"

      # Contrôle de FORME des secrets (sans jamais les afficher) et retrait des espaces / retours à la ligne collés
      # par erreur autour des identifiants.
      - name: Forme des secrets App Store Connect
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          kid=$(printf '%s' "$SECRET_KEY_ID" | tr -d '[:space:]')
          iss=$(printf '%s' "$SECRET_ISSUER_ID" | tr -d '[:space:]')
          team=$(printf '%s' "$SECRET_TEAM_ID" | tr -d '[:space:]')
          # Valeurs nettoyées masquées dans les journaux, comme les secrets d'origine.
          for v in "$kid" "$iss" "$team"; do [ -n "$v" ] && echo "::add-mask::$v"; done
          erreurs=0
          if ! [[ "$kid" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error title=APP_STORE_CONNECT_KEY_ID::doit faire 10 caractères (lettres majuscules et chiffres), actuellement ${#kid}. N'est-ce pas l'Issuer ID ou le Team ID ?"; erreurs=1
          fi
          if ! [[ "$iss" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error title=APP_STORE_CONNECT_ISSUER_ID::doit avoir la forme xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx (${#iss} caractères actuellement). N'est-ce pas le Key ID ou le Team ID ?"; erreurs=1
          fi
          if ! [[ "$team" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error title=APPLE_TEAM_ID::doit faire 10 caractères (lettres majuscules et chiffres), actuellement ${#team}."; erreurs=1
          fi
          if ! printf '%s' "$PRIVATE_KEY" | grep -q -- '-----BEGIN PRIVATE KEY-----' || ! printf '%s' "$PRIVATE_KEY" | grep -q -- '-----END PRIVATE KEY-----'; then
            echo "::error title=APP_STORE_CONNECT_PRIVATE_KEY::doit contenir tout le fichier .p8, lignes -----BEGIN PRIVATE KEY----- et -----END PRIVATE KEY----- comprises."; erreurs=1
          fi
          if [ "$kid" = "$team" ]; then
            echo "::error title=Secrets::APP_STORE_CONNECT_KEY_ID et APPLE_TEAM_ID sont identiques : le Key ID est celui de la clé (AuthKey_XXXX.p8), pas le Team ID."; erreurs=1
          fi
          [ "$erreurs" = 0 ] || exit 1
          { echo "ASC_KEY_ID=$kid"; echo "ASC_ISSUER_ID=$iss"; echo "APPLE_TEAM_ID=$team"; } >> "$GITHUB_ENV"
          echo "::notice title=Secrets::forme correcte (Key ID 10 car., Issuer ID au format UUID, Team ID 10 car., clé .p8 complète)."

      - name: Clé API (fichier temporaire, droits 600)
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          umask 077
          dossier="$RUNNER_TEMP/cle_asc"
          mkdir -p "$dossier"
          # Retours chariot Windows retirés (clé collée depuis le Bloc-notes).
          printf '%s\n' "$PRIVATE_KEY" | tr -d '\r' > "$dossier/AuthKey_${ASC_KEY_ID}.p8"
          # La clé doit être une clé privée EC P-256 lisible (sinon la signature des jetons est refusée par Apple).
          if ! openssl pkey -in "$dossier/AuthKey_${ASC_KEY_ID}.p8" -noout 2>/dev/null; then
            echo "::error title=APP_STORE_CONNECT_PRIVATE_KEY::le contenu n'est pas une clé privée lisible : recopiez tout le fichier .p8 sans le modifier."; exit 1
          fi
          if ! openssl pkey -in "$dossier/AuthKey_${ASC_KEY_ID}.p8" -text -noout 2>/dev/null | grep -q 'prime256v1\|P-256'; then
            echo "::error title=APP_STORE_CONNECT_PRIVATE_KEY::ce n'est pas une clé App Store Connect (EC P-256 attendue)."; exit 1
          fi
          echo "::notice title=Clé .p8::clé privée EC P-256 lisible."
          echo "ASC_PRIVATE_KEY_PATH=$dossier/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      # Numéro de build unique pour TestFlight : <N de pubspec>.<numéro du run> (ex. 48.7) ; version = pubspec.
      - name: Version et numéro de build
        env:
          NUMERO: ${{ inputs.numero_build }}
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | tr -d '[:space:]')
          nom=${version%%+*}
          numero="${version##*+}.${GITHUB_RUN_NUMBER}"
          if [ -n "$NUMERO" ]; then
            case "$NUMERO" in (*[!0-9.]*|.*|*.) echo "Numéro de build invalide : $NUMERO"; exit 1;; esac
            numero=$NUMERO
          fi
          echo "NOM_VERSION=$nom" >> "$GITHUB_ENV"
          echo "NUMERO_BUILD=$numero" >> "$GITHUB_ENV"
          echo "Version $nom ($numero)"

      - name: Installation de asc (version épinglée, empreinte vérifiée)
        run: |
          fichier="asc_${ASC_VERSION}_macOS_arm64"
          mkdir -p "$RUNNER_TEMP/outil_asc"
          curl -fsSL -o "$RUNNER_TEMP/outil_asc/asc" "https://github.com/rorkai/App-Store-Connect-CLI/releases/download/${ASC_VERSION}/${fichier}"
          # Empreinte épinglée ICI (relevée sur asc_5.14.3_checksums.txt) : un binaire remplacé est refusé.
          echo "${ASC_SHA256_MACOS_ARM64}  $RUNNER_TEMP/outil_asc/asc" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/outil_asc/asc"
          echo "ASC=$RUNNER_TEMP/outil_asc/asc" >> "$GITHUB_ENV"

      # Diagnostic avant la signature : la clé est-elle acceptée par Apple, et l'application existe-t-elle ?
      # (un 401 d'Apple pendant l'archive ne dit pas lequel des réglages est faux). Aucun secret affiché.
      - name: Vérification de la clé API et de l'application
        run: |
          if ! "$ASC" apps list --bundle-id "$BUNDLE_ID" --output json > "$RUNNER_TEMP/apps.json" 2> "$RUNNER_TEMP/asc_err.txt"; then
            sed -E 's/[A-Za-z0-9+\/=_-]{40,}/<masqué>/g' "$RUNNER_TEMP/asc_err.txt" | head -20
            # Contre-vérification indépendante d'asc : jeton ES256 fait ici (PyJWT), appel direct à l'API d'Apple.
            # Seul le code HTTP est affiché.
            python3 -m venv "$RUNNER_TEMP/venv_jwt" >/dev/null 2>&1 || true
            "$RUNNER_TEMP/venv_jwt/bin/pip" install --quiet --disable-pip-version-check pyjwt cryptography >/dev/null 2>&1 || true
            code=$("$RUNNER_TEMP/venv_jwt/bin/python" - <<'PY' 2>/dev/null || echo "erreur"
          import os, time, urllib.request, urllib.error, jwt
          cle = open(os.environ["ASC_PRIVATE_KEY_PATH"]).read()
          maintenant = int(time.time())
          jeton = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": maintenant, "exp": maintenant + 600,
                              "aud": "appstoreconnect-v1"}, cle, algorithm="ES256",
                             headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          requete = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?limit=1",
                                           headers={"Authorization": "Bearer " + jeton})
          try:
              print(urllib.request.urlopen(requete, timeout=30).status)
          except urllib.error.HTTPError as e:
              print(e.code)
          PY
            )
            echo "::notice title=Contre-vérification::appel direct à l'API App Store Connect : HTTP $code (200 = clé acceptée, 401 = identifiants refusés)."
            # Diagnostic : la même clé est-elle acceptée comme clé INDIVIDUELLE (sans Issuer ID) ?
            if ASC_KEY_TYPE=individual "$ASC" apps list --bundle-id "$BUNDLE_ID" --output json > /dev/null 2>&1; then
              echo "::error title=Clé individuelle::Apple accepte cette clé comme clé INDIVIDUELLE (onglet « Individual Keys »). La signature automatique exige une clé d'ÉQUIPE : App Store Connect › Utilisateurs et accès › Intégrations › App Store Connect API › Team Keys › +, accès Admin, puis remplacez les trois secrets."
              exit 1
            fi
            echo "::error title=Clé App Store Connect refusée::Apple refuse la clé. Vérifiez : 1) clé d'ÉQUIPE (Team Keys, pas « Individual ») ; 2) APP_STORE_CONNECT_KEY_ID = Key ID de cette clé (celui du nom AuthKey_XXXX.p8) ; 3) APP_STORE_CONNECT_ISSUER_ID = Issuer ID affiché au-dessus de la liste des clés ; 4) APP_STORE_CONNECT_PRIVATE_KEY = tout le fichier .p8, lignes BEGIN/END comprises ; 5) clé non révoquée."
            exit 1
          fi
          nb=$(jq '[.data[]? | select(.attributes.bundleId == env.BUNDLE_ID)] | length' "$RUNNER_TEMP/apps.json")
          if [ "$nb" = "0" ]; then
            echo "::error title=Application introuvable::La clé est acceptée, mais aucune application « $BUNDLE_ID » dans App Store Connect (Apps › + › Nouvelle app, ou vérifiez l'identifiant)."
            exit 1
          fi
          echo "::notice title=App Store Connect::Clé acceptée, application $BUNDLE_ID trouvée."

      - name: Préparation Flutter (configuration Xcode, sans signature)
        run: flutter build ios --release --config-only --no-codesign --build-name "$NOM_VERSION" --build-number "$NUMERO_BUILD"

      - name: Archive signée (signature automatique par la clé API)
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_PRIVATE_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic

      - name: Export de l'IPA (App Store Connect)
        run: |
          opts="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$opts"
          plutil -insert method -string app-store-connect "$opts"
          plutil -insert destination -string export "$opts"
          plutil -insert signingStyle -string automatic "$opts"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$opts"
          plutil -insert uploadSymbols -bool YES "$opts"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_PRIVATE_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ipa=$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)
          echo "IPA=$ipa" >> "$GITHUB_ENV"

      - name: Envoi vers TestFlight (« Quoi tester » en français)
        env:
          NOTES: ${{ inputs.quoi_tester }}
        run: |
          notes=${NOTES:-"Prestige Pharmacien $NOM_VERSION ($NUMERO_BUILD) : connexion au serveur de l'officine, tableau de bord, menus, exports et impressions. Signalez tout écran mal affiché sur iPhone ou iPad."}
          "$ASC" builds upload --app "$BUNDLE_ID" --ipa "$IPA" \
            --test-notes "$notes" --locale fr-FR --wait --output table

      - name: Groupe de testeurs
        if: inputs.groupe != '' || vars.TESTFLIGHT_GROUP != ''
        env:
          GROUPE: ${{ inputs.groupe || vars.TESTFLIGHT_GROUP }}
        run: |
          "$ASC" builds add-groups --app "$BUNDLE_ID" --build-number "$NUMERO_BUILD" --version "$NOM_VERSION" \
            --platform IOS --group "$GROUPE" --output table

      - name: Nettoyage de la clé API
        if: always()
        run: rm -rf "$RUNNER_TEMP/cle_asc" "$RUNNER_TEMP/ExportOptions.plist" "$HOME/.asc" || true
