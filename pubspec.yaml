name: prestige_app
description: Application de gestion Prestige.

publish_to: 'none'

version: 1.5.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Versions Mises à Jour ---
  http: ^1.2.1
  intl: ^0.20.2 # CORRECTION: Version compatible avec le SDK Flutter
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  fl_chart: ^1.2.0
  google_fonts: ^8.1.0
  printing: ^5.14.2
  pdf: ^3.11.0
  fluttertoast: ^9.0.0
  shimmer: ^3.0.0

  # --- Dépendances pour l'export ---
  csv: ^8.0.0
  path_provider: ^2.1.3
  share_plus: ^13.1.0
  permission_handler: ^12.0.1
  device_info_plus: ^13.1.0    # Pour connaître la version d'Android (gestion permissions)
  open_file: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21